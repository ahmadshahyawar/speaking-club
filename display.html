<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Club - Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }
        #videoBackground {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #videoBackground.youtube {
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }
        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .triangle-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }
        .content-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            min-width: 500px;
            max-width: 900px;
            animation: fadeIn 0.8s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background: white;
        }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            font-size: 1.2em;
            text-align: left;
        }
        td {
            padding: 15px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 1.1em;
        }
        tr:nth-child(even) {
            background: #f9f9ff;
        }
        .question-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .question {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .translation {
            font-size: 1.2em;
            color: #764ba2;
            font-style: italic;
        }
        .navigation {
            text-align: center;
            margin-top: 30px;
        }
        .navigation button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1em;
            margin: 0 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s;
        }
        .navigation button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .navigation button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .page-indicator {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin-top: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="videoContainer"></div>
    
    <div class="content-overlay">
        <div class="triangle-container">
            <div class="content-box" id="contentBox"></div>
        </div>
    </div>
    
    <div class="navigation">
        <button onclick="prevPage()" id="prevBtn">⬅️ Previous</button>
        <button onclick="nextPage()" id="nextBtn">Next ➡️</button>
    </div>
    <div class="page-indicator" id="pageIndicator"></div>

    <script>
        let data = {words: [], pages: [], current_video: ''};
        let currentPage = 0;

        async function loadData() {
            const res = await fetch('/api/data');
            data = await res.json();
            setupVideo();
            renderPage();
        }

        function setupVideo() {
            const container = document.getElementById('videoContainer');
            const videoUrl = data.current_video;
            
            if (!videoUrl) return;
            
            if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
                let embedUrl = videoUrl;
                if (videoUrl.includes('watch?v=')) {
                    const videoId = videoUrl.split('v=')[1].split('&')[0];
                    embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0`;
                }
                container.innerHTML = `<iframe id="videoBackground" class="youtube" src="${embedUrl}" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
            } else {
                container.innerHTML = `<video id="videoBackground" autoplay muted loop><source src="${videoUrl}" type="video/mp4"></video>`;
            }
        }

        function renderPage() {
            const box = document.getElementById('contentBox');
            
            if (currentPage === 0) {
                // Vocabulary page
                box.innerHTML = `
                    <h1>📚 Vocabulary</h1>
                    <table>
                        <thead>
                            <tr>
                                <th>English</th>
                                <th>Русский</th>
                                <th>Қазақша</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.words.map(w => `
                                <tr>
                                    <td>${w.en}</td>
                                    <td>${w.ru}</td>
                                    <td>${w.kz}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                // Question pages
                const pageData = data.pages[currentPage - 1];
                if (pageData) {
                    box.innerHTML = `
                        <h1>💬 Questions - Page ${currentPage}</h1>
                        <div class="question-section">
                            <div class="question">1. ${pageData.q1_en}</div>
                            <div class="translation">${pageData.q1_tr}</div>
                        </div>
                        <div class="question-section">
                            <div class="question">2. ${pageData.q2_en}</div>
                            <div class="translation">${pageData.q2_tr}</div>
                        </div>
                    `;
                }
            }
            
            updateNavigation();
        }

        function updateNavigation() {
            const totalPages = data.pages.length + 1;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
            document.getElementById('pageIndicator').textContent = `Page ${currentPage + 1} of ${totalPages}`;
        }

        function nextPage() {
            const totalPages = data.pages.length + 1;
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderPage();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        loadData();
    </script>
</body>
</html>
